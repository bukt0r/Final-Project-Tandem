<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Interview Trainer</title>

  <body>
    <script>
      (function(){
        var s=document.createElement('style');
        s.textContent='#app-preloader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;background:#f5f5f7;font-family:ui-sans-serif,system-ui,sans-serif}#app-preloader .spinner{width:32px;height:32px;border:3px solid #e2e2e6;border-top-color:#3aac9c;border-radius:50%;animation:pl-spin .6s linear infinite}#app-preloader span{font-size:14px;color:#7a7a8a}@keyframes pl-spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(s);
        var d=document.createElement('div');
        d.id='app-preloader';
        d.innerHTML='<div class="spinner"></div><span>Загрузка...</span>';
        document.body.appendChild(d);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
